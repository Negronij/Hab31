<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitos 365</title>
  <style>
    :root { --font-sans: system-ui, -apple-system, sans-serif; --color-text-primary: #1a1a1a; --color-text-secondary: #666; --color-border-tertiary: #eee; --border-radius-lg: 12px; --border-radius-md: 8px; --color-background-primary: #fff; --color-background-secondary: #f4f4f4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: #f9f9f9; padding: 20px; }
    .app { max-width: 680px; margin: 0 auto; }
    .card { background: white; border: 1px solid #ddd; border-radius: var(--border-radius-lg); padding: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    button { cursor: pointer; padding: 10px 20px; border-radius: var(--border-radius-md); border: 1px solid #ccc; background: #fff; font-weight: 500; }
    button:hover { background: #eee; }
    h1 { margin-bottom: 1rem; color: #333; }
    .login-container { text-align: center; margin-top: 50px; }
  </style>
</head>
<body>

<div class="app" id="app">
  <div id="login-screen" class="card login-container">
    <h1>Habitos 365</h1>
    <p style="margin-bottom: 20px; color: #666;">Inicia sesión para guardar tus progresos en la nube.</p>
    <button onclick="loginWithGoogle()">Iniciar sesión con Google</button>
  </div>

  <div id="main-screen" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="user-display">Habitos</h2>
      <button onclick="logout()">Salir</button>
    </div>
    <div id="content" style="margin-top:20px;"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
  import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

  // Configuración segura
  const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
  const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // Funciones expuestas al objeto window para los botones
  window.loginWithGoogle = async () => {
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    } catch (e) { console.error(e); }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      document.getElementById('user-display').textContent = `Hola, ${user.displayName || 'Usuario'}`;
      loadData();
    } else {
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('main-screen').style.display = 'none';
    }
  });

  function loadData() {
    const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'habits_config');
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('content').innerHTML = `<div>Datos cargados: ${data.habits?.length || 0} hábitos.</div>`;
      } else {
        document.getElementById('content').innerHTML = '<p>No hay hábitos configurados aún.</p>';
      }
    });
  }
</script>
</body>
</html>
