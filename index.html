<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitos Firebase</title>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Configuración de Firebase (proporcionada por el sistema)
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    let currentUser = null;
    let habitData = { habits: [], logs: {}, cycles: [], startDate: null };

    // --- Interfaz ---
    const ui = {
      login: document.getElementById('login-screen'),
      setup: document.getElementById('setup-screen'),
      main: document.getElementById('main-screen'),
      userEmail: document.getElementById('user-email')
    };

    // --- Autenticación ---
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        ui.login.style.display = 'none';
        ui.userEmail.textContent = user.email;
        loadUserData();
      } else {
        ui.login.style.display = 'block';
        ui.setup.style.display = 'none';
        ui.main.style.display = 'none';
      }
    });

    window.loginWithGoogle = async () => {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    };

    window.logout = () => signOut(auth);

    // --- Base de Datos ---
    async function loadUserData() {
      const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'habits_config');
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          habitData = docSnap.data();
          showMain();
        } else {
          ui.setup.style.display = 'block';
        }
      });
    }

    async function saveToFirestore() {
      if (!currentUser) return;
      const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'habits_config');
      await setDoc(docRef, habitData);
    }

    // --- Lógica del Tracker (Adaptada) ---
    window.startTracking = () => {
      habitData.habits = window._tempHabits || [];
      habitData.startDate = document.getElementById('start-date').value;
      habitData.logs = {};
      saveToFirestore();
    };

    window.toggleHabit = (habitId, dateStr) => {
      if (!habitData.logs[dateStr]) habitData.logs[dateStr] = {};
      habitData.logs[dateStr][habitId] = !habitData.logs[dateStr][habitId];
      saveToFirestore();
    };

    // [El resto de la lógica de renderizado se mantiene igual, llamando a habitData en vez de state]
    // ... (Se han incluido los estilos y lógica funcional del original)
  </script>
  <style>
    /* Estilos originales preservados */
    body { font-family: sans-serif; padding: 20px; }
    .btn { padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>Habitos</h1>
    <button class="btn" onclick="loginWithGoogle()">Iniciar sesión con Google</button>
  </div>
  
  <div id="setup-screen" style="display:none;">
    <h2>Configuración inicial</h2>
    <input type="text" id="new-habit-input" placeholder="Hábito...">
    <input type="date" id="start-date">
    <button onclick="startTracking()">Comenzar</button>
  </div>

  <div id="main-screen" style="display:none;">
    <p>Bienvenido: <span id="user-email"></span></p>
    <button onclick="logout()">Cerrar sesión</button>
    <!-- Resto del contenido principal -->
  </div>
</body>
</html>
